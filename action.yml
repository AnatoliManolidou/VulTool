name: 'CTI Vulnerability Remediation'
description: 'Autonomous CTI pipeline for immediate remediation of emerging vulnerabilities.'
author: 'Anatoli'

inputs:
  github_token:
    description: 'GitHub API token for pulling dependency graphs and fetching advisories'
    required: true
  llm_api_key:
    description: 'API key for the LLM used in exploit analysis (optional — pipeline runs through C8 in analysis-only mode without it)'
    required: false
  severity_threshold:
    description: 'Minimum severity to process (CRITICAL, HIGH, MODERATE, LOW)'
    required: false
    default: 'HIGH'
  watched_ghsa_ids:
    description: 'Comma-separated GHSA IDs to always fetch regardless of live feed position (e.g. GHSA-36jr-mh4h-2g58,GHSA-abc1-def2-ghi3)'
    required: false
    default: ''
  demo_mode:
    description: 'Use the bundled advisory feed instead of the live GitHub feed (randomly samples 20 of 56 advisories per run)'
    required: false
    default: 'false'
  discord_webhook_url:
    description: 'Discord webhook URL for pipeline notifications (optional — no notification sent if omitted)'
    required: false
  rescan_mode:
    description: 'Run in patch verification mode — re-scans a specific advisory on a fix branch to confirm the patch is effective'
    required: false
    default: 'false'
  rescan_ghsa_id:
    description: 'GHSA ID to target in rescan mode (required when rescan_mode is true)'
    required: false
    default: ''
  adjacent_risks:
    description: 'Include adjacent risk findings in the exploit analysis — secondary vulnerabilities in the application code spotted while reviewing the attack path (separate from the advisory under analysis)'
    required: false
    default: 'false'
  create_issue:
    description: 'Open a GitHub Issue for each confirmed exploitable vulnerability with the full exploit analysis report and fix branch link'
    required: false
    default: 'false'

runs:
  using: 'node24'
  main: 'dist/index.js'
