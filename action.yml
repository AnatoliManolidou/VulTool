name: 'CTI Vulnerability Remediation'
description: 'Autonomous CTI pipeline for immediate remediation of emerging vulnerabilities.'
author: 'Anatoli'

inputs:
  github_token:
    description: 'GitHub API token for pulling dependency graphs and fetching advisories'
    required: true
  llm_api_key:
    description: 'API key for the LLM used in exploit context generation and risk scoring (optional — pipeline runs in analysis-only mode without it)'
    required: false
  severity_threshold:
    description: 'Minimum severity to process (CRITICAL, HIGH, MODERATE, LOW)'
    required: false
    default: 'HIGH'
  watched_ghsa_ids:
    description: 'Comma-separated GHSA IDs to always fetch regardless of live feed position (e.g. GHSA-36jr-mh4h-2g58,GHSA-abc1-def2-ghi3)'
    required: false
    default: ''
  demo_mode:
    description: 'Use the bundled advisory feed instead of the live GitHub feed (randomly samples 8 of 20 advisories per run)'
    required: false
    default: 'false'

runs:
  using: 'node24'
  main: 'dist/index.js'
